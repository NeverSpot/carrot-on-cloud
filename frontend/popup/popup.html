<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrot on Cloud</title>
    <style>
        body {
            width: 220px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #fafafa;
            color: #333;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .status-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            display: inline-block;
            margin-right: 6px;
        }
        .dot.online { background: #4caf50; }
        .dot.offline { background: #f44336; }
        .footer {
            margin-top: 12px;
            font-size: 11px;
            text-align: center;
            color: #888;
        }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            🥕 Carrot on Cloud
        </div>
        <div class="status-box">
            <span>Backend Status:</span>
            <span><span id="status-dot" class="dot"></span><span id="status-text">Checking...</span></span>
        </div>
        <div class="footer">
            <a href="https://github.com/NeverSpot/carrot-on-cloud" target="_blank">GitHub Repo</a>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
